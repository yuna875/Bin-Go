name: tmp counter check
on:
  push:
    branches: [tmp-counter-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://abacus.jasoncameron.dev
          for u in "hit/bin-go-yuna875/d-2026-11-17" "create/bin-go-yuna875/probe-$(date +%s)" "info/bin-go-yuna875/total"; do
            echo "== abacus $u"; curl -sS -m 20 -i -H "Origin: https://yuna875.github.io" "$A/$u" | grep -iE "^HTTP|access-control-allow-origin|^\{" ; echo
          done
          C=https://api.counterapi.dev/v1/bingo-probe-yuna875
          for u in "x/up" "x/up" "x/" "y/"; do
            echo "== counterapi $u"; curl -sS -m 20 -i -H "Origin: https://yuna875.github.io" "$C/$u" | grep -iE "^HTTP|access-control-allow-origin|^\{" ; echo
          done
